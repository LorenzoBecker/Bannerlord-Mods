name: BST temporary .NET SDK export

on:
  push:
    branches:
      - bst-0.0.10-cloud-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Inspect SDK
        run: |
          dotnet --info
          du -sh /usr/share/dotnet
      - name: Archive SDK quickly
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          sudo tar -C /usr/share --use-compress-program='zstd -T0 -3' -cf "$RUNNER_TEMP/dotnet-sdk-linux-x64.tar.zst" dotnet
          sha256sum "$RUNNER_TEMP/dotnet-sdk-linux-x64.tar.zst" > "$RUNNER_TEMP/dotnet-sdk-linux-x64.tar.zst.sha256"
          ls -lh "$RUNNER_TEMP/dotnet-sdk-linux-x64.tar.zst"
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bst-dotnet-sdk-linux-x64-zstd
          path: |
            ${{ runner.temp }}/dotnet-sdk-linux-x64.tar.zst
            ${{ runner.temp }}/dotnet-sdk-linux-x64.tar.zst.sha256
          retention-days: 1
          compression-level: 0
